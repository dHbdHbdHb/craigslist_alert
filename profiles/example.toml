# ==============================================================================
#  TEMPLATE — copy this file, don't edit it in place.
#
#      cp profiles/example.toml profiles/yourname.toml
#
#  Then work top to bottom. Anything marked TODO needs your input; everything
#  else has a reasonable default you can leave alone at first.
#
#  Check your work at any point with:   python search_profile.py yourname
#  That validates the file and prints back what it understood, without sending
#  any email or scraping anything.
# ==============================================================================

# TODO: your short name. Lowercase, no spaces. Must match the filename:
# profiles/alex.toml -> name = "alex"
name = "yourname"

# TODO: how you want to be addressed in email subjects and on the dashboard.
display_name = "Your Name"

# Flip to false any time to pause your search without deleting anything.
enabled = true


# ── 1. Budget & size ──────────────────────────────────────────────────────────
#  Cast a WIDE net here. This is what gets scraped; the alert filters in
#  sections 4 and 5 are what actually decide when you get emailed. If you set
#  max_price too tightly here, you'll never even see near-misses on the
#  dashboard, and you lose the price context that makes it useful.

[search]
max_price    = 5600   # TODO: your absolute ceiling, plus ~15% headroom
min_bedrooms = 2      # TODO

region = "sfbay"

# TODO: the subarea you actually want. This matters more than it looks — a
# region search covers the whole metro and only the first page is scraped, so
# without a subarea a San Francisco search returns a handful of SF listings
# buried in a few hundred East Bay ones.
# sfbay subareas: sfc (SF), eby (east bay), pen (peninsula), sby (south bay),
# nby (north bay), scz (santa cruz). Leave "" to search the whole region.
subarea = "sfc"

city = "San Francisco"   # exact match, or "" to keep every city


# ── 2. Neighborhoods ──────────────────────────────────────────────────────────
#  To see the boundaries on a real map before choosing, run:
#
#      python neighborhoods/neighborhood_shapes.py
#
#  then open sf_neighborhoods_map.html in a browser and hover the shapes.
#
#  Available: Duboce, NOPA/USF zone, Haight/Cole Valley, Inner Sunset,
#             Castro/Noe, Mission, Chill Mission, Bernal, Potrero Hill,
#             Glen Park/Excelsior, Way Out There
#
#  ("Chill Mission" is the quieter southeast slice of the Mission. "Way Out
#   There" is the western half of the city plus anything that didn't land in a
#   defined shape.)
#
#  Want a neighborhood that isn't listed? See "Adding a neighborhood" in
#  SETUP.md — it takes about five minutes with geojson.io.

[neighborhoods]
# true  = only listings inside these shapes reach your digest.
# false = nothing is dropped; the list below only sets the order things are
#         grouped in, and anything matching no shape appears under
#         "Elsewhere in the city" at the end.
#
# Start with false unless you're sure the shapes cover everywhere you'd live.
# They're hand-drawn and cover a fraction of the city, so `true` quietly
# discards most of what gets scraped.
filter = false

# TODO: everywhere you'd consider, best first. Use [] to mean "all known shapes".
include = [
    "Mission",
    "Chill Mission",
    "Bernal",
    "Potrero Hill",
]


# ── 3. Who gets the email ─────────────────────────────────────────────────────
#  Mail is sent FROM the shared Gmail account configured in secrets.env.
#  These are the recipients. Empty list = the digest is off.
#
#  Testing tip: put YOUR address here first and leave it until you're happy with
#  what arrives, then swap in the real recipients. Nothing else needs to change.

[alerts]
# TODO: daily summary. Add your partner, roommate, whoever's searching with you.
digest_to = [
    "you@example.com",
]


# ── 4. What makes the daily digest ────────────────────────────────────────────
#  The "worth a look" band. One email a day, grouped by neighborhood.

[alerts.digest]
min_price = 2100   # TODO: anything cheaper is almost always a scam or bait
max_price = 5300   # TODO

# Wait this long after posting before a listing can show up in a digest, so
# Craigslist's community flagging catches obvious scams first.
min_posting_age_minutes = 20

# A listing whose title contains any of these is silently skipped.
scam_keywords = [
    "email only",
    "email me only",
    "overseas",
    "no calls",
    "no phone calls",
]


# ── 5. Dashboard ──────────────────────────────────────────────────────────────

[dashboard]
# Filled in for you by SETUP.md once the dashboard is published. Leave as ""
# until then and digest emails will simply omit the link.
url = ""

map_center = [37.758, -122.433]   # [latitude, longitude] — SF city center

# Daniel's Mar–Apr 2026 SF price data, shown as a separate historical layer so
# it never mixes into your live numbers. Set false to hide it entirely.
show_historical = true


# ── 6. Commute to work (optional) ─────────────────────────────────────────────
#  Door-to-door PUBLIC TRANSIT time from each listing to one fixed destination,
#  computed against a weekday morning so every listing is comparable.
#
#  Needs GOOGLE_MAPS_API_KEY in secrets.env. Without it this section is ignored
#  and nothing breaks — you just get no commute numbers.
#
#  Delete this whole section if you don't care about commuting to one place.
#
#  ⚠️  Coordinates are [longitude, latitude] — the OPPOSITE order from
#      map_center above. In SF that's roughly [-122.x, 37.x].

[commute]
# TODO: where you're commuting to. Right-click a spot in Google Maps and pick
# the lat/long it offers, then swap the order to put longitude first.
destination      = [-122.4194, 37.7806]
destination_name = "work"        # shown in emails and on the dashboard

# Listings whose commute exceeds this are dropped from the digest entirely.
max_minutes = 45

# Weekday arrival time the itinerary is planned against, 24-hour.
arrive_by = "09:00"

# How the transit score trades off its three inputs. They're relative, so
# doubling all three changes nothing.
#   time        door-to-door minutes against max_minutes
#   frequency   the worst headway on the trip — a 30-min bus leg is the trip
#   redundancy  how many distinct lines can make the journey
[commute.weights]
time       = 0.45
frequency  = 0.35
redundancy = 0.20


# ── 7. Bike-to-station anchors (optional) ─────────────────────────────────────
#  Cycling time from each listing to the nearest station in each group, via
#  OpenRouteService. This is separate from [commute] above and answers a
#  different question — "could I bike to a train?" rather than "how long is my
#  commute?"
#
#  Delete both lists (or the whole section) to turn bike times off. A profile
#  with no stations skips ORS entirely.

[transit]
caltrain = [
    { name = "4th & King", coords = [-122.3942, 37.7763] },
    { name = "22nd St",    coords = [-122.3925, 37.7577] },
]

bart = [
    { name = "16th St Mission", coords = [-122.4199, 37.7651] },
    { name = "24th St Mission", coords = [-122.4183, 37.7523] },
    { name = "Glen Park",       coords = [-122.4334, 37.7329] },
    { name = "Civic Center",    coords = [-122.4135, 37.7796] },
]
